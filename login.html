<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión - SGP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <style>

        body{
            margin:0;
            padding:0;
            min-height:100vh;

            background: linear-gradient(
                135deg,
                #003b8e,
                #004ea8,
                #0066cc
            );

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-container{

            width:450px;

            background:white;

            border-radius:20px;

            padding:40px;

            box-shadow:0 10px 30px rgba(0,0,0,0.25);

            text-align:center;
        }

        .logo-login{

            width:140px;

            margin-bottom:15px;
        }

        .titulo-sistema{

            color:#001a82;

            font-weight:bold;
        }

        .btn-login{

            background:#001a82;

            border:none;
        }

        .btn-login:hover{

            background:#1738b8;
        }

        .links-login a{

            text-decoration:none;
        }

        .footer-login{

            margin-top:20px;

            font-size:13px;

            color:#666;
        }

    </style>

</head>

<body>

<div class="login-container">

    <img
        src="assets/logo-unicauca.png"
        alt="Universidad del Cauca"
        class="logo-login">

    <h3 class="titulo-sistema">

        Sistema de Gestión de Pasantías

    </h3>

    <p>

        Facultad de Ingeniería Civil

    </p>

    <hr>

    <form>

        <div class="mb-3">

            <label class="form-label text-start d-block">

                Usuario

            </label>

            <input
                type="text"
                class="form-control"
                placeholder="Ingrese su usuario">

        </div>

        <div class="mb-3">

            <label class="form-label text-start d-block">

                Contraseña

            </label>

            <input
                type="password"
                class="form-control"
                placeholder="********">

        </div>

        <div class="d-grid">

            <a
                href="index.html"
                class="btn btn-primary btn-login">

                Ingresar

            </a>

        </div>

    </form>

    <div class="links-login mt-4">

        <a href="recuperar-password.html">

            ¿Olvidó su contraseña?

        </a>

        <br><br>

    </div>

    <div class="footer-login">

        Universidad del Cauca<br>
        Facultad de Ingeniería Civil

    </div>

</div>

</body>

</html>
